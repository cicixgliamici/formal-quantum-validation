[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-quantum-validation"
version = "0.1.0"
description = "Executable and formal validation of restricted unitary quantum circuits"
# Python 3.12 is the shared development and CI baseline.
requires-python = ">=3.12,<3.13"

dependencies = [
    # Pin direct dependencies; transitive versions are recorded separately.
    "numpy==2.3.5",
    "qiskit==2.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.16.6"
]

[project.scripts]
fqv-verify = "fqv.cli:main"
fqv-bell = "fqv.cli:main"
fqv-generate = "fqv.generate_cli:main"
fqv-generate-lean = "fqv.generate_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fqv = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "build/.pytest_cache"
# Let pytest allocate an isolated temporary root for each local or CI invocation.
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Keep CI focused on correctness, imports, and maintainable Python style.
select = ["E4", "E7", "E9", "F", "I"]
# Quantum notation conventionally names the imaginary amplitude token `I`.
ignore = ["E741"]
