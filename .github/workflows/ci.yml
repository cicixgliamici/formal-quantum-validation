name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Python version
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install the project
        run: python -m pip install -e ".[dev]"

      - name: Run executable checks
        run: python -m pytest

      - name: Regenerate the formal Bell obligation
        run: >-
          python -m fqv.generate_cli
          examples/bell_ir.json
          src/fqv/data/bell.contract.json
          /tmp/GeneratedBell.lean

      - name: Regenerate the formal GHZ obligation
        run: >-
          python -m fqv.generate_cli
          examples/ghz3_ir.json
          src/fqv/data/ghz3.contract.json
          /tmp/GeneratedGhz3.lean

      # Generated proof obligations must remain traceable to committed inputs.
      - name: Check generated Lean source for drift
        run: |
          diff -u lean/QuantumValidation/GeneratedBell.lean /tmp/GeneratedBell.lean
          diff -u lean/QuantumValidation/GeneratedGhz3.lean /tmp/GeneratedGhz3.lean

  lean:
    name: Lean checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The action reads lean-toolchain and caches matching Lake dependencies.
      - name: Build the formal development
        uses: leanprover/lean-action@v1
