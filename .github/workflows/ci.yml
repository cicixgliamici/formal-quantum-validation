name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  coq:
    name: Coq checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read the shared toolchain pins
        run: grep -v '^#' coq/toolchain.env >> "$GITHUB_ENV"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
      - name: Build the pinned Coq and SQIR environment
        run: opam exec -- bash coq/setup.sh
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install Python test dependencies
        run: python -m pip install -c constraints-python312.txt -e ".[dev]"
      - name: Check committed Coq source for drift
        run: python -m pytest tests/test_coq_drift.py -v
      # The fixture builds Circuit.v before compiling its generated clients.
      - name: Check Coq examples, gate semantics, and mutated DJ targets
        run: opam exec -- python -m pytest coq_tests -v

  python:
    name: Python checks
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Python version
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-python312.txt

      - name: Install the project
        run: python -m pip install -c constraints-python312.txt -e ".[dev]"

      - name: Check Python style and imports
        run: python -m ruff check src tests coq_tests integration_tests

      - name: Run executable checks
        run: python -m pytest

      - name: Check installed dependency compatibility
        run: python -m pip check

      - name: Check installed entry point outside the checkout
        working-directory: ${{ runner.temp }}
        run: fqv-verify

      - name: Regenerate the formal Bell obligation
        run: >-
          python -m fqv.generate_cli
          examples/bell_ir.json
          src/fqv/data/bell.contract.json
          "${{ runner.temp }}/GeneratedBell.lean"

      - name: Regenerate the formal GHZ obligation
        run: >-
          python -m fqv.generate_cli
          examples/ghz3_ir.json
          src/fqv/data/ghz3.contract.json
          "${{ runner.temp }}/GeneratedGhz3.lean"

      - name: Regenerate the formal DJ constant obligation
        run: >-
          python -m fqv.generate_cli
          examples/dj2_constant_ir.json
          src/fqv/data/dj2_constant.contract.json
          "${{ runner.temp }}/GeneratedDj2Constant.lean"

      - name: Regenerate the formal DJ balanced obligation
        run: >-
          python -m fqv.generate_cli
          examples/dj2_balanced_ir.json
          src/fqv/data/dj2_balanced.contract.json
          "${{ runner.temp }}/GeneratedDj2Balanced.lean"

      # Compare all four Lean obligations with fresh output from committed JSON.
      # Temporary output preserves the committed files so drift fails visibly.
      - name: Check generated Lean source for drift
        run: |
          diff -u lean/QuantumValidation/GeneratedBell.lean "${{ runner.temp }}/GeneratedBell.lean"
          diff -u lean/QuantumValidation/GeneratedGhz3.lean "${{ runner.temp }}/GeneratedGhz3.lean"
          diff -u lean/QuantumValidation/GeneratedDj2Constant.lean "${{ runner.temp }}/GeneratedDj2Constant.lean"
          diff -u lean/QuantumValidation/GeneratedDj2Balanced.lean "${{ runner.temp }}/GeneratedDj2Balanced.lean"

  lean:
    name: Lean checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The action reads lean-toolchain and caches matching Lake dependencies.
      - name: Build the formal development
        uses: leanprover/lean-action@v1

      - name: Install Python for cross-system semantic checks
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-python312.txt

      - name: Install the semantic test dependencies
        run: python -m pip install -c constraints-python312.txt -e ".[dev]"

      # These tests invoke Lean on Qiskit-derived targets, not just generated text.
      - name: Compare every supported gate with Qiskit on basis inputs
        run: python -m pytest integration_tests -v
